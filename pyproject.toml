[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seoaudit"
version = "0.1.0"
description = "Modular SEO audit engine with plugin-based checks and PDF reports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2,brotli]>=0.24",
    "selectolax>=0.3.11",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "typer>=0.9",
    "rich>=13.0",
    "protego>=0.2",
    "defusedxml>=0.7",
    "extruct>=0.13",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.21"]

[project.scripts]
seoaudit = "seoaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/seoaudit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
