[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seoaudit"
version = "0.1.0"
description = "Modular SEO audit engine with plugin-based checks and PDF reports"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx[http2,brotli]>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "typer>=0.12",
    "rich>=13.7",
    "protego>=0.3",
    "defusedxml>=0.7",
    "extruct>=0.17",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
seoaudit = "seoaudit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/seoaudit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
