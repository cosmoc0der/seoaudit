# Copy to config.yaml and pass with: seoaudit audit https://site.ru -c config.yaml
# All keys are optional; omitted ones fall back to defaults.
# Full list of rules with current params: seoaudit rules -c config.yaml

lang: ru                   # report language: ru or en

crawl:
  max_pages: 300
  max_depth: 10
  concurrency: 8
  timeout: 20
  delay: 0                 # seconds between requests per worker
  device: mobile           # mobile (as Googlebot Smartphone) or desktop
  # user_agent: "..."      # overrides the device preset
  robots_agent: Googlebot  # robots.txt rules are evaluated for this agent
  respect_robots: true
  use_sitemap: true
  include_subdomains: false
  exclude:                 # regexes
    - /bitrix/
    - \?print=
  strip_params: [utm_*, gclid, yclid, fbclid]

report:
  formats: [pdf, json, csv]
  max_urls_per_rule: 10
  include_passed: true
  include_recommendations: true   # false: findings only, without what-to-do and developer instructions
  meta:
    title: SEO-аудит сайта
    author: Digital Agency
    logo: ./logo.png

# Check plugins: enable/disable and set options
checks:
  pagespeed:
    enabled: true
    options:
      provider: auto       # auto | api | local (Lighthouse via Node.js, no key needed)
      api_key: null        # or env PAGESPEED_API_KEY
      strategies: [mobile, desktop]
      max_pages: 3
  html:
    options:
      validator: auto      # auto | local (vnu, no network) | online (validator_url)
      validator_pages: null
  rendering:
    options:
      max_pages: 10        # pages rendered in headless Chromium and compared with the server HTML
  bots:
    options:
      sample_pages: 5      # pages fetched as a browser and as Googlebot to detect cloaking
  # security:
  #   enabled: false

# Rule overrides: enabled, severity, category, params
rules:
  images.too_large:
    params:
      max_kb: 500
  meta.title_length:
    params:
      min_px: 200
      max_px: 600
  meta.twitter_card_missing:
    enabled: false
  security.csp_missing:
    severity: low

# Local plugin directories: every subfolder with __init__.py + rules.yaml is a check
plugin_paths:
  - ./examples/plugins
