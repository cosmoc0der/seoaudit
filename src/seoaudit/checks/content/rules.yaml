category: content

rules:
  h1_missing:
    severity: medium
    text:
      ru:
        title: Отсутствует заголовок H1
        description: H1 — главный заголовок страницы, важный сигнал релевантности для поисковиков и пользователей.
        recommendation: Добавьте один H1 с основной ключевой фразой страницы.
        fix: |
          ```html
          <h1>Название страницы</h1>
          ```
          Частая ошибка — логотип или название сайта в H1 на всех страницах, а реальный заголовок
          в `<div class="title">`. Логотип делайте обычным `<a>`, а заголовок контента — H1.

  h1_multiple:
    severity: low
    text:
      ru:
        title: Несколько заголовков H1
        description: Несколько H1 допустимы для поисковиков, но один главный заголовок делает структуру страницы понятнее.
        recommendation: Оставьте один H1, остальные заголовки сделайте H2–H3.
        message: "H1 на странице: $count ($values)"
        fix: |
          Проверьте шаблоны шапки, футера и виджетов — там часто используют H1 для оформления.
          Визуальный стиль задавайте через CSS-классы, а не через уровень заголовка.

  heading_empty:
    severity: medium
    text:
      ru:
        title: Пустой заголовок H1
        description: Тег H1 есть, но не содержит текста (например, только картинку без alt).
        recommendation: Добавьте в H1 текст.
        fix: |
          Если в H1 только изображение — добавьте текст, а картинку оформите отдельно,
          либо задайте изображению осмысленный alt.

  heading_hierarchy:
    severity: low
    text:
      ru:
        title: Нарушена иерархия заголовков
        description: >-
          Пропуск уровней (например, H2 → H4 без H3) мешает программам экранного доступа
          и усложняет поддержку вёрстки; на ранжирование влияет слабо.
        recommendation: Используйте заголовки последовательно, без пропуска уровней.
        message: "После $prev идёт $next: «$value»"
        fix: |
          Структура должна быть вложенной, как оглавление:
          ```text
          H1 Название страницы
            H2 Раздел
              H3 Подраздел
            H2 Другой раздел
          ```

  thin_content:
    severity: medium
    params:
      min_words: 250
    text:
      ru:
        title: Мало текстового контента
        description: >-
          На странице меньше $min_words слов (с учётом меню и подвала). Сам объём не фактор
          ранжирования, но страницы без полезного содержимого поисковики считают малоценными (thin content).
        recommendation: Расширьте контент полезной информацией для пользователя.
        message: "Слов на странице: $words"
        fix: |
          Добавьте уникальные описания, характеристики, FAQ, отзывы, инструкции.
          Если страница служебная (корзина, вход) — закройте её `noindex`.
          Для карточек товаров выводите характеристики текстом, а не картинками.

  text_ratio:
    severity: info
    params:
      min_percent: 10
    text:
      ru:
        title: Низкая доля текста в HTML
        description: >-
          Видимый текст составляет менее $min_percent% от объёма HTML. На ранжирование это не влияет,
          но часто указывает на перегруженную разметку, инлайн-скрипты и стили, которые замедляют загрузку.
        recommendation: Вынесите инлайн-CSS/JS во внешние файлы и упростите разметку.
        message: "Доля текста: $ratio%"
        fix: |
          - Перенесите большие `<script>` и `<style>` во внешние кэшируемые файлы.
          - Уберите SVG-спрайты из HTML, подключайте их файлом.
          - Удалите лишние обёртки `div` и неиспользуемую разметку.

  placeholder_text:
    severity: high
    params:
      # Only phrases that never occur in real copy; "coming soon" did, in an ordinary FAQ answer.
      markers: ["lorem ipsum", "dolor sit amet", "здесь будет текст", "текст-рыба", "тестовый текст"]
    text:
      ru:
        title: Текст-заглушка на странице
        description: На странице остался шаблонный текст-«рыба» — это выглядит непрофессионально и вредит качеству сайта.
        recommendation: Замените заглушки реальным контентом или закройте страницы от индексации.
        message: "Найдено: $markers — «$context»"
        fix: |
          Найдите заглушки поиском по шаблонам и базе данных CMS. Незаполненные страницы
          закройте `<meta name="robots" content="noindex">` до наполнения.

  duplicate_content:
    severity: high
    text:
      ru:
        title: Полные дубли контента
        description: Текст страницы полностью совпадает с другими страницами — поисковик оставит в индексе только одну.
        recommendation: Устраните дубли через 301-редирект, canonical или уникализацию.
        message:
          default: "Совпадает ещё с $count стр.: $others"
          copy: "Копия $original"
        fix: |
          Типичные источники дублей: URL со слэшем и без, с `index.php`, GET-параметры сортировки,
          версии для печати. Решения:
          1. 301-редирект на основной URL — если дубль не нужен пользователям.
          2. `<link rel="canonical">` на основную страницу — если дубль нужен (сортировки, фильтры).
          3. Уникальный контент — если страницы должны ранжироваться по разным запросам.

  near_duplicate:
    severity: medium
    params:
      max_distance: 3
      min_words: 50
    text:
      ru:
        title: Почти одинаковый контент
        description: >-
          Тексты страниц почти совпадают — отличаются лишь небольшие фрагменты. Это характерно для шаблонных страниц с
          минимальными отличиями (города, цвета товара), которые конкурируют между собой.
        recommendation: Уникализируйте контент или объедините похожие страницы.
        message:
          default: "Похожа ещё на $count стр.: $others"
          copy: "Похожа на $original"
        fix: |
          - Для вариаций товара (цвет, размер) — одна карточка с выбором варианта или canonical на основную.
          - Для региональных страниц — уникальные тексты, адреса, отзывы, кейсы по региону.
          - Сократите общий шаблонный текст (сквозные блоки), увеличьте уникальную часть.

  soft_404:
    severity: high
    params:
      max_page_words: 1500
      max_main_words: 150
      min_main_words: 10
    refs: [https://developers.google.com/search/docs/crawling-indexing/http-network-errors#soft-404-errors]
    text:
      ru:
        title: Пустые страницы и страницы ошибок с кодом 200
        description: >-
          Страница отвечает 200, но по содержанию это ошибка «не найдено» или пустой шаблон: шапка и подвал
          без основного контента (пустая категория, архив без записей). Google помечает такие страницы
          как soft 404, Яндекс — как малоценные; они тратят краулинговый бюджет и снижают качество сайта в целом.
        recommendation: Отдавайте 404 для несуществующего контента, а пустые разделы наполните или закройте noindex.
        message:
          not_found: "Текст ошибки в заголовке: «$value»"
          empty: "Основного контента почти нет (слов без шапки и подвала: $words)"
        fix: |
          - Страница ошибки должна отдаваться со статусом 404, а не 200 — проверьте обработчик в приложении.
          - Пустые категории, теги и архивы: либо наполните их, либо выводите
            `<meta name="robots" content="noindex, follow">`, пока в разделе нет записей,
            и не включайте их в sitemap.
          - В WordPress ненужные таксономии отключаются в настройках SEO-плагина («Показывать в результатах поиска: нет»).

  js_rendered:
    severity: high
    params:
      max_words: 50
      max_links: 3
      min_scripts: 3
    refs: [https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics]
    text:
      ru:
        title: Контент формируется только JavaScript
        description: >-
          В исходном HTML почти нет текста и ссылок — страница собирается скриптами в браузере. Google
          отрисовывает такие страницы с задержкой и не всегда полностью, Яндекс и соцсети часто видят пустую
          страницу. Остальные проверки этого аудита для таких страниц неполны.
        recommendation: Отдавайте основной контент и ссылки в HTML с сервера (SSR или пререндеринг).
        message: "Слов в исходном HTML: $words"
        fix: |
          - Включите серверный рендеринг: Next.js / Nuxt (SSR или SSG), Angular Universal, Vite SSR.
          - Если переписать нельзя — пререндеринг статических HTML-версий страниц при сборке.
          - Ссылки делайте обычными `<a href="/путь">`, а не обработчиками onclick: по ним робот находит страницы.
          Проверка: «Просмотр кода страницы» (Ctrl+U) должен содержать текст и ссылки, а не пустой `<div id="root">`.

  param_duplicates:
    severity: high
    refs: [https://yandex.ru/support/webmaster/ru/robot-workings/double]
    text:
      ru:
        title: Дубли страниц из-за GET-параметров
        description: >-
          Адрес с параметрами (метки, сортировка, сессии) отдаёт тот же контент, что и основная страница,
          и открыт для индексации. Яндекс Вебмастер отмечает это критической проблемой: в поиск может попасть
          не та версия, а вес делится между дублями.
        recommendation: Укажите canonical на основной адрес и добавьте параметры в Clean-param для Яндекса.
        message:
          default: "Копия $original (параметры: $params)"
          clean_param: "Копия $original (параметры: $params); Clean-param для Яндекса задан, но Google нужен canonical"
        fix: |
          1. На страницах с параметрами выведите canonical на адрес без них:
             ```html
             <link rel="canonical" href="https://example.com/catalog/">
             ```
          2. Для Яндекса перечислите незначащие параметры в robots.txt:
             ```text
             User-agent: Yandex
             Clean-param: sort&utm_source&utm_medium /catalog/
             ```
          3. Не ставьте внутренние ссылки на адреса с метками и сортировками, если они не меняют контент.
