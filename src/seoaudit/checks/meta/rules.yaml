category: meta

rules:
  title_missing:
    severity: critical
    refs: [https://developers.google.com/search/docs/appearance/title-link]
    text:
      ru:
        title: Отсутствует тег title
        description: >-
          Title — один из важнейших внутренних факторов ранжирования и заголовок сниппета в выдаче.
          Без него поисковик сам сгенерирует заголовок, часто неудачный.
        recommendation: Добавьте уникальный информативный title на каждую страницу.
        fix: |
          Добавьте в `<head>` тег `<title>` с ключевой фразой в начале:
          ```html
          <head>
            <title>Название страницы — уточнение | Название сайта</title>
          </head>
          ```
          В CMS/фреймворке задайте шаблон title для каждого типа страниц
          (категория, товар, статья), чтобы он генерировался автоматически.

  title_multiple:
    severity: medium
    text:
      ru:
        title: Несколько тегов title на странице
        description: Несколько title сбивают поисковик — он может выбрать не тот заголовок.
        recommendation: Оставьте ровно один title в `<head>`.
        message: "Найдено тегов title: $count"
        fix: |
          Найдите в шаблонах (layout, header, SEO-плагины) дублирующий вывод `<title>`
          и оставьте один. Частая причина — тема CMS и SEO-плагин выводят title одновременно.

  title_length:
    severity: low
    params:
      min_px: 200
      max_px: 561
      font_px: 20
    refs: [https://developers.google.com/search/docs/appearance/title-link]
    text:
      ru:
        title: Неоптимальная длина title
        description: >-
          Слишком короткий title не раскрывает содержимое страницы, слишком длинный обрезается в выдаче.
          Google обрезает заголовок по ширине в пикселях, а не по числу символов: широкие буквы (Ш, Ж, M, W)
          занимают больше места. Ориентир — от $min_px до $max_px px, это примерно 30–60 символов.
        recommendation: Уложите title в $min_px–$max_px px — главное в первых словах.
        message:
          short: "Ширина ~$width px (меньше $min_px px), символов: $length — «$value»"
          long: "Ширина ~$width px (обрезается после ~$max_px px), символов: $length — «$value»"
        fix: |
          - Ставьте главную ключевую фразу в начало title.
          - Добавляйте уточнения: регион, тип товара, выгоду.
          - Название бренда выносите в конец через `|` или `—`.
          - Для шаблонных страниц обрезайте динамическую часть по длине на бэкенде.

  title_duplicate:
    severity: medium
    scope: page
    text:
      ru:
        title: Дублирующиеся title
        description: >-
          Одинаковые title на разных страницах мешают поисковику понять, какую страницу
          показывать по запросу, и приводят к каннибализации.
        recommendation: Сделайте title уникальным для каждой индексируемой страницы.
        message: "«$value» — ещё на $count стр."
        fix: |
          Добавьте в шаблон title уникализирующие элементы: название товара/категории,
          номер страницы пагинации (`— страница 2`), значения фильтров.
          Если страницы действительно дублируют друг друга — склейте их 301-редиректом
          или укажите `<link rel="canonical">` на основную.

  description_missing:
    severity: medium
    refs: [https://developers.google.com/search/docs/appearance/snippet]
    text:
      ru:
        title: Отсутствует meta description
        description: >-
          Description используется для сниппета, особенно в Яндексе. Без него поисковик сам
          подберёт фрагмент текста, не всегда удачный.
        recommendation: Добавьте продающее описание страницы в meta description.
        fix: |
          ```html
          <meta name="description" content="Краткое описание страницы: что здесь есть, главная выгода и призыв к действию.">
          ```
          Для массовых страниц настройте шаблон: `{Название} — {ключевая выгода}. {Призыв к действию}.`

  description_length:
    severity: low
    params:
      min_px: 400
      max_px: 985
      font_px: 13
    text:
      ru:
        title: Неоптимальная длина meta description
        description: >-
          Сниппет в выдаче обрезается по ширине в пикселях: ориентир — от $min_px до $max_px px,
          это примерно 70–155 символов. Слишком короткое описание поисковик заменит фрагментом текста страницы.
        recommendation: Уложите description в $min_px–$max_px px.
        message:
          short: "Ширина ~$width px (меньше $min_px px), символов: $length — «$value»"
          long: "Ширина ~$width px (обрезается после ~$max_px px), символов: $length — «$value»"
        fix: |
          Сформулируйте 1–2 предложения: что на странице, ключевая выгода, призыв к действию.
          Важное размещайте в первых 120 символах — на мобильных сниппет короче.

  description_duplicate:
    severity: medium
    text:
      ru:
        title: Дублирующиеся meta description
        description: Одинаковые описания снижают релевантность сниппетов и сигнализируют о шаблонном контенте.
        recommendation: Сделайте description уникальным для каждой индексируемой страницы.
        message: "«$value» — ещё на $count стр."
        fix: |
          Используйте в шаблоне динамические данные страницы (название, цену, характеристики).
          Если уникальный текст сформировать нельзя — лучше оставить description пустым,
          чем дублировать: поисковик сам подберёт фрагмент.

  viewport_missing:
    severity: high
    category: mobile
    refs: [https://developer.mozilla.org/docs/Web/HTML/Viewport_meta_tag]
    text:
      ru:
        title: Отсутствует meta viewport
        description: >-
          Без viewport мобильные браузеры показывают десктопную версию в уменьшенном виде.
          Страница не считается адаптированной под мобильные — это критично при индексации по мобильной версии.
        recommendation: Добавьте meta viewport в `<head>` всех страниц.
        fix: |
          ```html
          <meta name="viewport" content="width=device-width, initial-scale=1">
          ```

  viewport_invalid:
    severity: medium
    category: mobile
    text:
      ru:
        title: Некорректный meta viewport
        description: Viewport без `width=device-width` или с запретом масштабирования ухудшает мобильный UX и доступность.
        recommendation: Используйте адаптивный viewport без запрета масштабирования.
        message:
          width: "Нет width=device-width: «$value»"
          zoom: "Запрещено масштабирование: «$value»"
        fix: |
          Замените значение на стандартное:
          ```html
          <meta name="viewport" content="width=device-width, initial-scale=1">
          ```
          Уберите `user-scalable=no` и `maximum-scale=1` — пользователи со слабым зрением
          должны иметь возможность увеличить страницу.

  charset_missing:
    severity: low
    category: html
    text:
      ru:
        title: Не указана кодировка страницы
        description: Без явной кодировки браузер и роботы могут неверно отобразить текст (кракозябры).
        recommendation: Укажите кодировку UTF-8 в заголовке ответа и в HTML.
        fix: |
          Первой строкой в `<head>`:
          ```html
          <meta charset="utf-8">
          ```
          И в заголовке ответа сервера: `Content-Type: text/html; charset=utf-8`.

  lang_missing:
    severity: low
    text:
      ru:
        title: Не указан язык страницы (html lang)
        description: Атрибут lang нужен программам экранного доступа, переводчику браузера и Bing; Google определяет язык по тексту.
        recommendation: Укажите язык в атрибуте lang тега html.
        fix: |
          ```html
          <html lang="ru">
          ```
          Для мультиязычного сайта значение должно соответствовать языку конкретной версии (`kk`, `en` и т.д.).

  meta_refresh:
    severity: medium
    category: indexability
    text:
      ru:
        title: Используется meta refresh
        description: >-
          Перенаправление через meta refresh срабатывает только после загрузки страницы, медленнее
          серверного редиректа и неудобно пользователям; с задержкой поисковики считают его временным.
        recommendation: Замените meta refresh на серверный 301-редирект.
        message: "meta refresh: «$value»"
        fix: |
          Удалите `<meta http-equiv="refresh" ...>` и настройте редирект на сервере.
          nginx:
          ```nginx
          location = /old-page { return 301 https://example.com/new-page; }
          ```
          Apache (.htaccess):
          ```apache
          Redirect 301 /old-page https://example.com/new-page
          ```

  og_missing:
    severity: low
    params:
      required: ["og:title", "og:description", "og:image"]
    refs: [https://ogp.me/]
    text:
      ru:
        title: Нет разметки Open Graph
        description: >-
          Open Graph определяет, как страница выглядит при репостах в соцсетях и мессенджерах
          (Telegram, WhatsApp, Facebook). Без неё превью формируется случайно.
        recommendation: "Добавьте теги Open Graph: $required."
        message: "Не хватает: $missing"
        fix: |
          ```html
          <meta property="og:type" content="website">
          <meta property="og:title" content="Заголовок страницы">
          <meta property="og:description" content="Краткое описание">
          <meta property="og:image" content="https://example.com/og/page.jpg">
          <meta property="og:url" content="https://example.com/page">
          ```
          Рекомендуемый размер og:image — 1200×630 px.

  twitter_card_missing:
    severity: info
    text:
      ru:
        title: Нет разметки Twitter Card
        description: Twitter Card управляет превью ссылок в X (Twitter). При её отсутствии используется Open Graph.
        recommendation: При необходимости добавьте `twitter:card`.
        fix: |
          ```html
          <meta name="twitter:card" content="summary_large_image">
          ```

  favicon_missing:
    severity: low
    scope: site
    text:
      ru:
        title: Нет favicon
        description: Favicon отображается в выдаче Google и Яндекса рядом с сайтом и повышает узнаваемость.
        recommendation: Добавьте favicon и объявите его в `<head>`.
        fix: |
          ```html
          <link rel="icon" href="/favicon.ico" sizes="32x32">
          <link rel="icon" href="/icon.svg" type="image/svg+xml">
          <link rel="apple-touch-icon" href="/apple-touch-icon.png">
          ```
          Иконка должна быть квадратной: Google — не меньше 8×8 px, рекомендуется больше 48×48 px;
          Яндекс рекомендует 120×120 px (SVG или PNG). Файл не должен быть закрыт в robots.txt.

  description_multiple:
    severity: medium
    text:
      ru:
        title: Несколько meta description на странице
        description: >-
          Поисковик выбирает одно из описаний на своё усмотрение или игнорирует все — сниппет становится
          непредсказуемым.
        recommendation: Оставьте ровно один meta description.
        message: "Тегов description: $count ($values)"
        fix: |
          Обычно второе описание выводят одновременно тема CMS и SEO-плагин или шаблон и отдельный компонент.
          Найдите все места вывода `<meta name="description">` и оставьте одно.
