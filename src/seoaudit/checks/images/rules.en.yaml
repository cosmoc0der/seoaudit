rules:
  alt_missing:
    title: Images without an alt attribute
    description: >-
      Alt describes the image for search engines (ranking in image search) and for blind users. An empty
      `alt=""` is acceptable only for decorative images.
    recommendation: Add a descriptive alt to every meaningful image.
    message: "Images without alt: $count (for example: $examples)"
    fix: |
      ```html
      <img src="photo.jpg" alt="A short description of what the image shows">
      <img src="divider.svg" alt="">  <!-- decorative -->
      ```
      Make the alt field required on image upload in the CMS; for products, generate the alt from the
      product name by default.

  too_large:
    title: Heavy images (over $max_kb KB)
    description: Heavy images slow down page loading and worsen LCP, one of the Core Web Vitals.
    recommendation: Compress images to $max_kb KB or less and serve them at the displayed size.
    message: "$size_kb KB, used on $pages pages (for example, $page)"
    fix: |
      1. Compress on upload: `cwebp -q 80 in.jpg -o out.webp`, Squoosh, ImageMagick, sharp.
      2. Do not serve images larger than their display size: use `srcset`/`sizes`.
      ```html
      <img src="photo-800.webp"
           srcset="photo-400.webp 400w, photo-800.webp 800w, photo-1600.webp 1600w"
           sizes="(max-width: 600px) 100vw, 800px"
           width="800" height="600" alt="...">
      ```
      3. Use a CDN with automatic image optimization (imgproxy, Cloudflare Images, Thumbor).

  legacy_format:
    title: Images in legacy formats
    description: WebP and AVIF are 25–50% smaller than JPEG/PNG at the same quality.
    recommendation: Convert images to WebP or AVIF with a fallback for old browsers.
    message: "$format, $size_kb KB"
    fix: |
      ```html
      <picture>
        <source srcset="photo.avif" type="image/avif">
        <source srcset="photo.webp" type="image/webp">
        <img src="photo.jpg" width="800" height="600" alt="...">
      </picture>
      ```
      Or have the server or CDN serve WebP/AVIF automatically based on the `Accept` header.

  broken_images:
    title: Broken images
    description: The images do not load; users see empty blocks and the search engine records errors.
    recommendation: Restore the files or fix the image paths.
    message: "Response: $status, on $pages pages (for example, $page)"
    fix: |
      Check the file path (letter case matters on Linux servers), that the file exists on the server/CDN,
      and the access permissions. Remove references to images that no longer exist.

  missing_dimensions:
    title: Images without width and height
    description: >-
      Without explicit dimensions the browser does not reserve space for the image, and the content jumps
      when it loads, which raises CLS (Cumulative Layout Shift).
    recommendation: Set the width and height attributes on images.
    message: "Images: $count (for example: $examples)"
    fix: |
      ```html
      <img src="photo.webp" width="800" height="600" alt="...">
      ```
      ```css
      img { max-width: 100%; height: auto; }
      ```
      The CSS keeps the image responsive, and the attributes set the aspect ratio for reserving space.

  lazy_loading:
    title: Images without lazy loading
    description: >-
      Images below the first screen load immediately and compete for bandwidth with important resources.
      SVG icons, images with an explicit loading="eager" or fetchpriority="high", and the first images
      of the page ($skip_first of them) are not counted.
    recommendation: Add loading="lazy" to images outside the first screen.
    message: "Images: $count (for example: $examples)"
    fix: |
      ```html
      <img src="photo.webp" loading="lazy" width="800" height="600" alt="...">
      ```
      Do not put `loading="lazy"` on the main image of the first screen (the LCP element);
      use `fetchpriority="high"` for it.
