category: images

options:
  max_images: 1000

rules:
  alt_missing:
    severity: medium
    params:
      allow_empty: true
    refs: [https://developers.google.com/search/docs/appearance/google-images#use-descriptive-alt-text]
    text:
      ru:
        title: Изображения без атрибута alt
        description: >-
          Alt описывает изображение для поисковиков (ранжирование в поиске по картинкам)
          и для незрячих пользователей. Пустой `alt=""` допустим только для декоративных картинок.
        recommendation: Добавьте описательный alt ко всем значимым изображениям.
        message: "Изображений без alt: $count (например: $examples)"
        fix: |
          ```html
          <img src="rog-strix-g16.jpg" alt="Ноутбук ASUS ROG Strix G16, вид спереди">
          <img src="divider.svg" alt="">  <!-- декоративное -->
          ```
          В CMS сделайте поле alt обязательным при загрузке изображения; для товаров
          генерируйте alt из названия товара по умолчанию.

  too_large:
    severity: medium
    scope: site
    params:
      max_kb: 200
    refs: [https://web.dev/articles/fast#optimize_your_images]
    text:
      ru:
        title: Тяжёлые изображения (более $max_kb КБ)
        description: Тяжёлые изображения замедляют загрузку страниц и ухудшают LCP — один из Core Web Vitals.
        recommendation: Сожмите изображения до $max_kb КБ и меньше, отдавайте их в нужном размере.
        message: "$size_kb КБ, используется на $pages стр. (например, $page)"
        fix: |
          1. Сжимайте при загрузке: `cwebp -q 80 in.jpg -o out.webp`, Squoosh, ImageMagick, sharp.
          2. Не отдавайте картинки больше размера показа: используйте `srcset`/`sizes`.
          ```html
          <img src="photo-800.webp"
               srcset="photo-400.webp 400w, photo-800.webp 800w, photo-1600.webp 1600w"
               sizes="(max-width: 600px) 100vw, 800px"
               width="800" height="600" alt="...">
          ```
          3. Подключите CDN с автоматической оптимизацией изображений (imgproxy, Cloudflare Images, Thumbor).

  legacy_format:
    severity: low
    scope: site
    params:
      formats: [image/jpeg, image/png, image/gif, image/bmp, image/tiff]
      min_kb: 30
    text:
      ru:
        title: Изображения в устаревших форматах
        description: WebP и AVIF весят на 25–50% меньше JPEG/PNG при том же качестве.
        recommendation: Конвертируйте изображения в WebP или AVIF с фолбэком для старых браузеров.
        message: "$format, $size_kb КБ"
        fix: |
          ```html
          <picture>
            <source srcset="photo.avif" type="image/avif">
            <source srcset="photo.webp" type="image/webp">
            <img src="photo.jpg" width="800" height="600" alt="...">
          </picture>
          ```
          Либо настройте автоматическую отдачу WebP/AVIF на уровне сервера или CDN по заголовку `Accept`.

  broken_images:
    severity: high
    scope: site
    text:
      ru:
        title: Битые изображения
        description: Изображения не загружаются — пользователи видят пустые блоки, поисковик фиксирует ошибки.
        recommendation: Восстановите файлы или исправьте пути к изображениям.
        message: "Ответ: $status, на $pages стр. (например, $page)"
        fix: |
          Проверьте путь к файлу (регистр букв важен на Linux-серверах), наличие файла на сервере/CDN
          и права доступа. Удалите ссылки на изображения, которых больше нет.

  missing_dimensions:
    severity: low
    category: performance
    refs: [https://web.dev/articles/optimize-cls#images-without-dimensions]
    text:
      ru:
        title: Изображения без width и height
        description: >-
          Без явных размеров браузер не резервирует место под картинку, и при её загрузке
          контент «прыгает» — растёт CLS (Cumulative Layout Shift).
        recommendation: Укажите атрибуты width и height у изображений.
        message: "Изображений: $count (например: $examples)"
        fix: |
          ```html
          <img src="photo.webp" width="800" height="600" alt="...">
          ```
          ```css
          img { max-width: 100%; height: auto; }
          ```
          CSS сохранит адаптивность, а атрибуты зададут пропорции для резервирования места.

  lazy_loading:
    severity: low
    category: performance
    params:
      skip_first: 3
    text:
      ru:
        title: Изображения без отложенной загрузки
        description: >-
          Изображения ниже первого экрана грузятся сразу, конкурируя за канал с важными ресурсами.
          Первые $skip_first изображения не учитываются.
        recommendation: Добавьте loading="lazy" изображениям вне первого экрана.
        message: "Изображений: $count (например: $examples)"
        fix: |
          ```html
          <img src="photo.webp" loading="lazy" width="800" height="600" alt="...">
          ```
          Не ставьте `loading="lazy"` на главное изображение первого экрана (LCP-элемент) —
          для него используйте `fetchpriority="high"`.
