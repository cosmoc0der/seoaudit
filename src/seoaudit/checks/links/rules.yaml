category: links

rules:
  broken_internal:
    severity: high
    params:
      max_probes: 500
    text:
      ru:
        title: Битые внутренние ссылки
        description: >-
          Ссылки ведут на несуществующие страницы (4xx) или на страницы с ошибкой сервера (5xx).
          Это ухудшает пользовательский опыт и тратит краулинговый бюджет.
        recommendation: Исправьте или удалите ссылки на недоступные страницы.
        message: "Ответ: $status. Страниц со ссылкой: $pages ($examples)"
        fix: |
          1. Исправьте URL ссылки в шаблоне/контенте, если в нём опечатка.
          2. Если страница удалена навсегда — настройте 301-редирект на релевантную замену
             и обновите ссылки на новый адрес.
          3. Ошибки 5xx — смотрите логи приложения: это проблема бэкенда, а не ссылки.

  internal_redirect:
    severity: low
    text:
      ru:
        title: Внутренние ссылки на редиректы
        description: Ссылки ведут на URL с редиректом — лишний запрос для пользователя и робота.
        recommendation: Замените ссылки на конечные адреса.
        message: "$status → $final. Страниц со ссылкой: $pages ($examples)"
        fix: |
          Обновите ссылки в меню, шаблонах и контенте, указав конечный URL.
          Частая причина — ссылки без слэша на конце или на `http://` при работающем HTTPS.

  broken_external:
    severity: low
    params:
      max_probes: 300
      ignore_statuses: [401, 403, 429, 999]
    text:
      ru:
        title: Битые внешние ссылки
        description: Ссылки на неработающие внешние ресурсы ухудшают пользовательский опыт и выглядят как устаревший контент.
        recommendation: Обновите или удалите неработающие внешние ссылки.
        message: "Ответ: $status. Страниц со ссылкой: $pages ($examples)"
        fix: |
          Замените ссылку на актуальный адрес ресурса, архивную копию (web.archive.org) или удалите её.
          Коды 401/403/429 не считаются ошибкой — многие сайты блокируют автоматические проверки.

  external_unreachable:
    severity: info
    text:
      ru:
        title: Внешние сайты не ответили
        description: >-
          Сайт не ответил на проверку (таймаут или ошибка соединения). Это может быть как мёртвый домен,
          так и блокировка по региону или защита от ботов, поэтому на оценку не влияет.
        recommendation: Откройте ссылки вручную и удалите те, что не работают и у пользователей.
        message: "Сайт не ответил. Страниц со ссылкой: $pages ($examples)"
        fix: |
          Если сайт недоступен и из браузера — замените ссылку на архивную копию (web.archive.org) или удалите её.

  empty_anchor:
    severity: low
    text:
      ru:
        title: Ссылки без текста
        description: >-
          У ссылки нет текста анкора, aria-label или alt у вложенного изображения. Поисковик
          не понимает, о чём целевая страница, а программы экранного доступа не могут её озвучить.
        recommendation: Добавьте текст, aria-label или alt для изображений внутри ссылок.
        message: "Ссылок без текста: $count (например: $examples)"
        fix: |
          ```html
          <!-- Плохо -->
          <a href="/cart"><svg>...</svg></a>
          <!-- Хорошо -->
          <a href="/cart" aria-label="Корзина"><svg aria-hidden="true">...</svg></a>
          <a href="/razdel/"><img src="icon.png" alt="Название раздела"></a>
          ```

  internal_nofollow:
    severity: low
    text:
      ru:
        title: Внутренние ссылки с nofollow
        description: nofollow на внутренних ссылках мешает распределению веса и обходу собственных страниц.
        recommendation: Уберите rel="nofollow" с внутренних ссылок.
        message: "Ссылок: $count (например: $examples)"
        fix: |
          Если страницу не нужно индексировать, используйте `noindex` на самой странице,
          а не nofollow на ссылках к ней. Для служебных разделов допустим запрет в robots.txt.

  insecure_links:
    severity: low
    text:
      ru:
        title: Ссылки на HTTP-версии страниц
        description: С HTTPS-страниц ведут ссылки на незащищённые http:// адреса.
        recommendation: Замените ссылки на https:// версии.
        message: "Ссылок: $count (например: $examples)"
        fix: |
          Выполните массовую замену `http://ваш-домен` на `https://ваш-домен` в базе данных и
          шаблонах. Для внешних ресурсов проверьте поддержку HTTPS и обновите ссылки.

  too_many_links:
    severity: low
    params:
      max_links: 300
    text:
      ru:
        title: Слишком много ссылок на странице
        description: Более $max_links ссылок на странице размывают передаваемый вес и затрудняют навигацию.
        recommendation: Сократите количество ссылок, оставив значимые.
        message: "Ссылок на странице: $count"
        fix: |
          Упростите мега-меню, сгруппируйте ссылки, уберите дублирующиеся блоки навигации,
          для длинных списков используйте пагинацию или подгрузку.

  no_outlinks:
    severity: medium
    text:
      ru:
        title: Страницы без исходящих внутренних ссылок
        description: >-
          Со страницы нельзя перейти на другие страницы сайта: для робота это тупик, вес дальше не передаётся,
          а посетитель уходит. Часто так выглядят страницы, где меню строится скриптом.
        recommendation: Добавьте на страницу обычные ссылки на другие разделы сайта.
        message:
          default: "Нет ни одной индексируемой внутренней ссылки"
          nofollow: "Все ссылки закрыты meta robots nofollow"
        fix: |
          - Меню, хлебные крошки и ссылки в контенте выводите в HTML как `<a href="/раздел/">`,
            а не через обработчики onclick или кнопки.
          - Уберите `nofollow` из meta robots, если страница не служебная.

  nofollow_inlinks_only:
    severity: medium
    text:
      ru:
        title: На страницу ведут только nofollow-ссылки
        description: >-
          Индексируемая страница получает внутренние ссылки только с атрибутом nofollow или со страниц
          с meta nofollow. Поисковик может не найти её и не передаёт ей вес.
        recommendation: Поставьте на страницу хотя бы одну обычную внутреннюю ссылку.
        message: "Страниц со ссылкой: $pages ($examples)"
        fix: |
          Уберите `rel="nofollow"` со ссылок на эту страницу в меню и шаблонах. Если страница не должна
          попадать в поиск — закройте её noindex, а не ссылки к ней.

  single_inlink:
    severity: info
    text:
      ru:
        title: Страницы с единственной входящей ссылкой
        description: >-
          На страницу ведёт ссылка только с одной страницы сайта. Такие страницы получают мало веса
          и реже переобходятся; для важных посадочных этого недостаточно.
        recommendation: Добавьте ссылки на важные страницы из меню, категорий и связанных материалов.
        message: "Единственная ссылка — со страницы $source"
        fix: |
          Добавьте блоки «Похожие материалы», ссылки из категорий и хлебные крошки, упомяните страницу
          в тематических статьях. Для ключевых страниц — ссылка из основного меню.

  to_non_indexable:
    severity: low
    text:
      ru:
        title: Внутренние ссылки на неиндексируемые страницы
        description: >-
          Ссылки ведут на страницы, закрытые noindex или указывающие canonical на другой адрес. Робот тратит
          обход на страницы, которые не попадут в поиск, а вес ссылок уходит впустую.
        recommendation: Ставьте ссылки на основные индексируемые версии страниц.
        message:
          noindex: "Страница закрыта noindex. Страниц со ссылкой: $pages ($examples)"
          canonical: "Canonical страницы указывает на $final. Страниц со ссылкой: $pages ($examples)"
          variants: "Ссылки ведут на адреса с canonical на эту страницу (адресов: $count, например: $variants). Страниц со ссылкой: $pages"
        fix: |
          - Если страница закрыта noindex по ошибке — уберите директиву.
          - Если это дубль — замените ссылки на адрес из его canonical.
          - Служебные страницы (вход, корзина) в сквозных блоках допустимы, но не ставьте на них ссылки из контента.

  non_descriptive_anchor:
    severity: low
    scope: site
    params:
      phrases: [подробнее, читать далее, читать дальше, далее, ещё, еще, здесь, тут, по ссылке, перейти,
                узнать больше, узнать подробнее, click here, here, read more, more, learn more, details, more info]
    refs: [https://developers.google.com/search/docs/crawling-indexing/links-crawlable#anchor-text-placement]
    text:
      ru:
        title: Неинформативный текст ссылок
        description: >-
          Анкор «подробнее» или «здесь» ничего не говорит поисковику о целевой странице. Google использует
          текст ссылки, чтобы понять, о чём страница, на которую она ведёт.
        recommendation: Пишите в тексте ссылки, куда она ведёт.
        message: "«$text»: ссылок — $links, на страницах: $pages (например: $examples)"
        fix: |
          ```html
          <!-- Плохо -->
          <a href="/services/audit/">Подробнее</a>
          <!-- Хорошо -->
          <a href="/services/audit/">Подробнее об аудите сайта</a>
          ```
          Если по дизайну нужна короткая кнопка — сделайте ссылкой заголовок карточки или всю карточку целиком
          вместо отдельной кнопки «Подробнее».

  tracking_params:
    severity: medium
    params:
      params: [utm_*, yclid, gclid, fbclid, _openstat, phpsessid, sessionid, jsessionid]
    text:
      ru:
        title: Внутренние ссылки с UTM-метками и идентификаторами сессий
        description: >-
          Метки и сессионные параметры во внутренних ссылках создают дубли страниц для поисковиков,
          а в аналитике перезаписывают настоящий источник визита.
        recommendation: Ставьте во внутренних ссылках чистые адреса без меток и сессий.
        message: "Параметры: $params. Страниц со ссылкой: $pages ($examples)"
        fix: |
          - UTM-метки нужны только во внешних ссылках на сайт (реклама, рассылки), не в меню и баннерах внутри сайта.
          - Идентификатор сессии храните в cookie, а не в URL (для PHP: `session.use_trans_sid = 0`,
            `session.use_only_cookies = 1`).
          - Для уже проиндексированных адресов выведите canonical на чистый URL; для Яндекса добавьте
            параметры в `Clean-param` в robots.txt.

  malformed:
    severity: medium
    text:
      ru:
        title: Некорректные ссылки
        description: >-
          Ссылки, по которым робот не может перейти: навигация через JavaScript-код в href, адреса
          localhost или локальных файлов, опечатки в протоколе. Страницы за такими ссылками
          не обнаруживаются, а посетитель получает ошибку.
        recommendation: Замените их обычными ссылками на рабочие адреса сайта.
        message:
          javascript: "Переход выполняется JavaScript-кодом. Страниц со ссылкой: $pages ($examples)"
          local: "Ссылка на localhost или локальный файл. Страниц со ссылкой: $pages ($examples)"
          scheme: "Опечатка в протоколе. Страниц со ссылкой: $pages ($examples)"
        fix: |
          - Вместо `<a href="javascript:openPage('/page')">` используйте `<a href="/page">`, а дополнительное
            поведение повесьте обработчиком события.
          - Ссылки на `localhost`, `127.0.0.1` и `file://` остаются после разработки — замените их адресами
            рабочего сайта.
          - Проверьте протокол: `https://example.com/`, а не `https//`, `https:/` или `htps://`.
