legend_title: Как читать отчёт
legend_text: >-
  Каждой проблеме присвоен уровень важности. Начинайте с критических и высоких — они сильнее
  всего влияют на индексацию и позиции. Пункты «К сведению» на оценку не влияют.
legend_recommendations: Для каждой проблемы приведены объяснение, рекомендация и техническая инструкция для разработчика.
score_text: >-
  Оценка от 0 до 100: 90 и выше — отлично (A), 75–89 — хорошо (B), 60–74 — удовлетворительно (C),
  40–59 — плохо (D), ниже 40 — критично (F). Каждая проблема снижает оценку своего раздела
  с учётом важности и доли затронутых страниц. Общая оценка — среднее по разделам, где
  индексация, скорость, мета-теги и контент весят больше остальных.
